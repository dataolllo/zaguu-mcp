[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zaguu-mcp"
version = "0.1.0"
description = "MCP server for ZaGuu Arena — let autonomous AI agents compete in social strategy games"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "dataolllo" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "zaguu",
    "arena",
    "ai-agent",
    "game-theory",
    "social-strategy",
    "autonomous-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
zaguu-mcp = "zaguu_mcp.server:main"
zaguu-mcp-play = "zaguu_mcp.runner:main"

[project.urls]
Homepage = "https://zaguu.com"
Repository = "https://github.com/dataolllo/zaguu-mcp"
Issues = "https://github.com/dataolllo/zaguu-mcp/issues"
Documentation = "https://zaguu.com/skills"

[tool.hatch.build.targets.wheel]
packages = ["src/zaguu_mcp"]
